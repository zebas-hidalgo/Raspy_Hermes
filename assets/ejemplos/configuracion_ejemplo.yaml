# Ejemplo de configuración .env para entorno educativo Kronos_School
# Copia este archivo a .env y ajusta según tus necesidades

# Modelo recomendado para la mayoría de agents (balance entre capacidad y costo)
HERMES_MODEL=nvidia/nemotron-3-super-120b-a12b
HERMES_PROVIDER=nvidia

# Límites de turnos y compresión (ajustables según agent específico)
HERMES_AGENT_MAX_TURNS=30
HERMES_COMPRESSION_ENABLED=true
HERMES_COMPRESSION_THRESHOLD=0.70

# Para habilidades específicas, algunos agents pueden requerir habilidades adicionales
# Estas se activan por defecto en su skill principal

# Ejemplo de configuración para Capa (impresión 3D)
# HERMES_MODEL_CAPA=nvidia/nemotron-3-super-120b-a12b
# HERMES_AGENT_MAX_TURNS_CAPA=35

# Ejemplo de configuración para Elektra (electrónica)
# HERMES_MODEL_ELEKTRA=nvidia/nemotron-3-super-120b-a12b
# HERMES_AGENT_MAX_TURNS_ELEKTRA=25

# Nota: Los valores reales se pueden configurar por agent usando
# la configuración de delegation o mediante variables de entorno específicas
