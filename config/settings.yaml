app:
  name: "Raspy_Hermes"
  environment: "Kronos_School"
  max_attachment_size_mb: 10

default_agent: "master"

agents:
  capa:
    display_name: "Maestro Capa"
    trigger: "@Capa"
    slash: "/capa"
    max_turns: 30
  elektra:
    display_name: "Elektra / Chispa"
    trigger: "@Elektra"
    aliases: ["@Chispa"]
    slash: "/elektra"
    max_turns: 25
  bio:
    display_name: "Bio"
    trigger: "@Bio"
    slash: "/bio"
    max_turns: 20
  caraxes:
    display_name: "Caraxes"
    trigger: "@Caraxes"
    slash: "/caraxes"
    max_turns: 35
  daemon:
    display_name: "Daemon"
    trigger: "@Daemon"
    slash: "/daemon"
    max_turns: 30
  warden:
    display_name: "Warden"
    trigger: "@Warden"
    slash: "/warden"
    max_turns: 25
  master:
    display_name: "Master"
    trigger: "@Master"
    slash: "/master"
    max_turns: 40
  tutor_conversion:
    display_name: "TutorConversion"
    trigger: "@TutorConversion"
    slash: "/tutor_conversion"
    max_turns: 35
