<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Flujo de Funcionamiento - Maestro Capa</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #059669;
      --accent-light: #ecfdf5;
      --accent-border: #a7f3d0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header { text-align: center; max-width: 800px; margin-bottom: 30px; }
    .header h1 { font-size: 26px; font-weight: 700; margin: 0 0 8px 0; color: #065f46; }
    .header p { font-size: 14px; color: var(--text-muted); margin: 0; }
    .diagram-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      max-width: 950px;
      width: 100%;
    }
    svg { width: 100%; height: auto; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Maestro Capa — Flujo de Funcionamiento en 4 Etapas</h1>
    <p>Agente Experto en Impresión 3D, Análisis STL y Diseño Cero Residuos (Cluster Dominio)</p>
  </div>

  <div class="diagram-container">
    <svg viewBox="0 0 900 480" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
        </marker>
      </defs>

      <!-- STAGE 1: TRIGGER -->
      <rect x="30" y="40" width="180" height="380" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="45" y="55" width="150" height="30" rx="6" fill="#059669"/>
      <text x="120" y="75" text-anchor="middle" font-weight="700" font-size="12" fill="#ffffff">ETAPA 1: TRIGGER</text>

      <rect x="45" y="105" width="150" height="80" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="55" y="125" font-weight="700" font-size="12" fill="#0f172a">Mención @Capa</text>
      <text x="55" y="145" font-size="11" fill="#64748b">• Mensaje en Telegram</text>
      <text x="55" y="160" font-size="11" fill="#64748b">• Mensaje en Discord</text>

      <rect x="45" y="200" width="150" height="80" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="55" y="220" font-weight="700" font-size="12" fill="#0f172a">Slash /capa</text>
      <text x="55" y="240" font-size="11" fill="#64748b">• Consulta directa</text>
      <text x="55" y="255" font-size="11" fill="#64748b">• Parámetros slicer</text>

      <rect x="45" y="295" width="150" height="105" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="55" y="315" font-weight="700" font-size="12" fill="#0f172a">Archivos Adjuntos</text>
      <text x="55" y="335" font-size="11" fill="#64748b">• .STL / .OBJ / .3MF</text>
      <text x="55" y="350" font-size="11" fill="#64748b">• Fotos de fallas (.PNG)</text>
      <text x="55" y="365" font-size="11" fill="#64748b">• Máx 10 MB</text>

      <!-- ARROW 1 -> 2 -->
      <path d="M 210 230 L 240 230" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- STAGE 2: PROCESSING & CONTEXT -->
      <rect x="250" y="40" width="180" height="380" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
      <rect x="265" y="55" width="150" height="30" rx="6" fill="#047857"/>
      <text x="340" y="75" text-anchor="middle" font-weight="700" font-size="11" fill="#ffffff">ETAPA 2: CONTEXTO</text>

      <rect x="265" y="105" width="150" height="90" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
      <text x="275" y="125" font-weight="700" font-size="12" fill="#065f46">Prompt System</text>
      <text x="275" y="145" font-size="11" fill="#047857">• Tono técnico-paciente</text>
      <text x="275" y="160" font-size="11" fill="#047857">• Enfoque Cero Residuos</text>
      <text x="275" y="175" font-size="11" fill="#047857">• Nivel 6to grado escolar</text>

      <rect x="265" y="210" width="150" height="90" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
      <text x="275" y="230" font-weight="700" font-size="12" fill="#065f46">Filtro de Seguridad</text>
      <text x="275" y="250" font-size="11" fill="#047857">• Validación de adjuntos</text>
      <text x="275" y="265" font-size="11" fill="#047857">• Bloqueo de ejecutables</text>
      <text x="275" y="280" font-size="11" fill="#047857">• Límites de consumo</text>

      <rect x="265" y="315" width="150" height="85" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
      <text x="275" y="335" font-weight="700" font-size="12" fill="#065f46">Configuración .env</text>
      <text x="275" y="355" font-size="11" fill="#047857">• Nemotron 120B</text>
      <text x="275" y="370" font-size="11" fill="#047857">• Compresión contextual</text>

      <!-- ARROW 2 -> 3 -->
      <path d="M 430 230 L 460 230" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- STAGE 3: SKILL EXECUTION -->
      <rect x="470" y="40" width="180" height="380" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
      <rect x="485" y="55" width="150" height="30" rx="6" fill="#059669"/>
      <text x="560" y="75" text-anchor="middle" font-weight="700" font-size="12" fill="#ffffff">ETAPA 3: SKILLS</text>

      <rect x="485" y="105" width="150" height="90" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
      <text x="495" y="125" font-weight="700" font-size="12" fill="#065f46">stl_analyzer</text>
      <text x="495" y="145" font-size="11" fill="#047857">• Cálculo de volumen/área</text>
      <text x="495" y="160" font-size="11" fill="#047857">• Detección de overhangs</text>
      <text x="495" y="175" font-size="11" fill="#047857">• Orientación óptima</text>

      <rect x="485" y="210" width="150" height="90" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
      <text x="495" y="230" font-weight="700" font-size="12" fill="#065f46">Slicer Config</text>
      <text x="495" y="250" font-size="11" fill="#047857">• Perfiles Ender 3 / PLA</text>
      <text x="495" y="265" font-size="11" fill="#047857">• Parámetros de retracción</text>
      <text x="495" y="280" font-size="11" fill="#047857">• Giroid & densidades</text>

      <rect x="485" y="315" width="150" height="85" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
      <text x="495" y="335" font-weight="700" font-size="12" fill="#065f46">excalidraw & visual</text>
      <text x="495" y="355" font-size="11" fill="#047857">• Diagramación de piezas</text>
      <text x="495" y="370" font-size="11" fill="#047857">• Render de ensamblajes</text>

      <!-- ARROW 3 -> 4 -->
      <path d="M 650 230 L 680 230" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- STAGE 4: OUTPUT & EFFECTS -->
      <rect x="690" y="40" width="180" height="380" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="705" y="55" width="150" height="30" rx="6" fill="#047857"/>
      <text x="780" y="75" text-anchor="middle" font-weight="700" font-size="12" fill="#ffffff">ETAPA 4: RESPUESTA</text>

      <rect x="705" y="105" width="150" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="715" y="125" font-weight="700" font-size="12" fill="#0f172a">Respuesta Bot</text>
      <text x="715" y="145" font-size="11" fill="#64748b">• 200-400 caracteres</text>
      <text x="715" y="160" font-size="11" fill="#64748b">• Viñetas y negritas</text>
      <text x="715" y="175" font-size="11" fill="#64748b">• Valores exactos (°C/mm)</text>

      <rect x="705" y="210" width="150" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="715" y="230" font-weight="700" font-size="12" fill="#0f172a">Feedback Cero Residuos</text>
      <text x="715" y="250" font-size="11" fill="#64748b">• Gramos de PLA usados</text>
      <text x="715" y="265" font-size="11" fill="#64748b">• Tiempo estimado</text>
      <text x="715" y="280" font-size="11" fill="#64748b">• Guía de desmolde/reciclaje</text>

      <rect x="705" y="315" width="150" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="715" y="335" font-weight="700" font-size="12" fill="#0f172a">Efectos Secundarios</text>
      <text x="715" y="355" font-size="11" fill="#64748b">• Ticket a Warden si hay falla</text>
      <text x="715" y="370" font-size="11" fill="#64748b">• Consulta a Bio para bioplast</text>
    </svg>
  </div>

</body>
</html>
