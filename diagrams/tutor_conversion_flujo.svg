<svg viewBox="0 0 900 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 12px; fill: #ffffff; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 12px; }
    .card-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
    .card-sub-purple { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #6d28d9; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
    </marker>
  </defs>

  <rect width="900" height="480" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- STAGE 1: TRIGGER -->
  <rect x="30" y="40" width="180" height="400" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="45" y="55" width="150" height="30" rx="6" fill="#7c3aed"/>
  <text x="120" y="75" text-anchor="middle" class="header-title">ETAPA 1: TRIGGER</text>

  <rect x="45" y="105" width="150" height="85" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="55" y="125" class="card-title" fill="#0f172a">Mención @TutorConv.</text>
  <text x="55" y="145" class="card-sub">• Conversión de guías</text>
  <text x="55" y="160" class="card-sub">• Adaptación lecciones</text>

  <rect x="45" y="205" width="150" height="85" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="55" y="225" class="card-title" fill="#0f172a">Slash /tutor_conv.</text>
  <text x="55" y="245" class="card-sub">• Análisis instruccional</text>
  <text x="55" y="260" class="card-sub">• Extracción Bloom</text>

  <rect x="45" y="305" width="150" height="110" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="55" y="325" class="card-title" fill="#0f172a">Archivos PDF / TXT</text>
  <text x="55" y="345" class="card-sub">• Guías docentes</text>
  <text x="55" y="360" class="card-sub">• Manuales escolares</text>

  <path d="M 210 240 L 240 240" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STAGE 2: PROCESSING & CONTEXT -->
  <rect x="250" y="40" width="180" height="400" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <rect x="265" y="55" width="150" height="30" rx="6" fill="#6d28d9"/>
  <text x="340" y="75" text-anchor="middle" class="header-title">ETAPA 2: CONTEXTO</text>

  <rect x="265" y="105" width="150" height="90" rx="6" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="275" y="125" class="card-title" fill="#5b21b6">Prompt System</text>
  <text x="275" y="145" class="card-sub-purple">• Analítico &amp; reflexivo</text>
  <text x="275" y="160" class="card-sub-purple">• Transformador creativo</text>
  <text x="275" y="175" class="card-sub-purple">• Respeto al original</text>

  <rect x="265" y="210" width="150" height="90" rx="6" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="275" y="230" class="card-title" fill="#5b21b6">Análisis Pedagógico</text>
  <text x="275" y="250" class="card-sub-purple">• Objetivos aprendizaje</text>
  <text x="275" y="265" class="card-sub-purple">• Hitos de evaluación</text>

  <rect x="265" y="315" width="150" height="100" rx="6" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="275" y="335" class="card-title" fill="#5b21b6">Configuración .env</text>
  <text x="275" y="355" class="card-sub-purple">• Nemotron 120B</text>
  <text x="275" y="370" class="card-sub-purple">• Turnos máx: 35</text>

  <path d="M 430 240 L 460 240" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STAGE 3: SKILL EXECUTION -->
  <rect x="470" y="40" width="180" height="400" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <rect x="485" y="55" width="150" height="30" rx="6" fill="#7c3aed"/>
  <text x="560" y="75" text-anchor="middle" class="header-title">ETAPA 3: SKILLS</text>

  <rect x="485" y="105" width="150" height="90" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="495" y="125" class="card-title" fill="#5b21b6">tutor &amp; quiz</text>
  <text x="495" y="145" class="card-sub-purple">• Generación preguntas</text>
  <text x="495" y="160" class="card-sub-purple">• Adaptación nivel</text>

  <rect x="485" y="210" width="150" height="90" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="495" y="230" class="card-title" fill="#5b21b6">writing-plans</text>
  <text x="495" y="250" class="card-sub-purple">• Estructuración skill</text>
  <text x="495" y="265" class="card-sub-purple">• Flujo conversacional</text>

  <rect x="485" y="315" width="150" height="100" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="495" y="335" class="card-title" fill="#5b21b6">excalidraw</text>
  <text x="495" y="355" class="card-sub-purple">• Ruta de aprendizaje</text>
  <text x="495" y="370" class="card-sub-purple">• Árbol de decisiones</text>

  <path d="M 650 240 L 680 240" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STAGE 4: OUTPUT & EFFECTS -->
  <rect x="690" y="40" width="180" height="400" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="705" y="55" width="150" height="30" rx="6" fill="#6d28d9"/>
  <text x="780" y="75" text-anchor="middle" class="header-title">ETAPA 4: RESPUESTA</text>

  <rect x="705" y="105" width="150" height="90" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="715" y="125" class="card-title" fill="#0f172a">Espec Nuevo Agente</text>
  <text x="715" y="145" class="card-sub">• Prompt adaptativo</text>
  <text x="715" y="160" class="card-sub">• Banco de preguntas</text>

  <rect x="705" y="210" width="150" height="90" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="715" y="230" class="card-title" fill="#0f172a">Hoja Cheatsheet</text>
  <text x="715" y="250" class="card-sub">• Resumen imprimible</text>
  <text x="715" y="265" class="card-sub">• Puntos clave</text>

  <rect x="705" y="315" width="150" height="100" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="715" y="335" class="card-title" fill="#0f172a">Pase a Daemon</text>
  <text x="715" y="355" class="card-sub">• Empaquetar como skill</text>
  <text x="715" y="370" class="card-sub">• Publicar tutor bot</text>
</svg>
