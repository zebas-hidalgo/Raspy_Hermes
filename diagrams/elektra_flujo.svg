<svg viewBox="0 0 900 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 12px; fill: #ffffff; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 12px; }
    .card-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
    .card-sub-green { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #047857; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>

  <rect width="900" height="480" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- STAGE 1: TRIGGER -->
  <rect x="30" y="40" width="180" height="400" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="45" y="55" width="150" height="30" rx="6" fill="#059669"/>
  <text x="120" y="75" text-anchor="middle" class="header-title">ETAPA 1: TRIGGER</text>

  <rect x="45" y="105" width="150" height="85" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="55" y="125" class="card-title" fill="#0f172a">Mención @Elektra</text>
  <text x="55" y="145" class="card-sub">• Alias @Chispa</text>
  <text x="55" y="160" class="card-sub">• Consultas circuitos</text>

  <rect x="45" y="205" width="150" height="85" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="55" y="225" class="card-title" fill="#0f172a">Slash /elektra</text>
  <text x="55" y="245" class="card-sub">• Petición esquemas</text>
  <text x="55" y="260" class="card-sub">• Calibración Ohm</text>

  <rect x="45" y="305" width="150" height="110" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="55" y="325" class="card-title" fill="#0f172a">Esquemas &amp; Fotos</text>
  <text x="55" y="345" class="card-sub">• Imágenes protoboard</text>
  <text x="55" y="360" class="card-sub">• Código Arduino (.ino)</text>

  <path d="M 210 240 L 240 240" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STAGE 2: PROCESSING & CONTEXT -->
  <rect x="250" y="40" width="180" height="400" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
  <rect x="265" y="55" width="150" height="30" rx="6" fill="#047857"/>
  <text x="340" y="75" text-anchor="middle" class="header-title">ETAPA 2: CONTEXTO</text>

  <rect x="265" y="105" width="150" height="90" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="275" y="125" class="card-title" fill="#065f46">Prompt System</text>
  <text x="275" y="145" class="card-sub-green">• Entusiasta y chispeante</text>
  <text x="275" y="160" class="card-sub-green">• Metáforas de agua</text>
  <text x="275" y="175" class="card-sub-green">• Obsesión por seguridad</text>

  <rect x="265" y="210" width="150" height="90" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="275" y="230" class="card-title" fill="#065f46">Check Seguridad</text>
  <text x="275" y="250" class="card-sub-green">• Voltajes 5V/9V seguros</text>
  <text x="275" y="265" class="card-sub-green">• Polaridad LED/Diodos</text>

  <rect x="265" y="315" width="150" height="100" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="275" y="335" class="card-title" fill="#065f46">Configuración .env</text>
  <text x="275" y="355" class="card-sub-green">• Nemotron 120B</text>
  <text x="275" y="370" class="card-sub-green">• Turnos máx: 25</text>

  <path d="M 430 240 L 460 240" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STAGE 3: SKILL EXECUTION -->
  <rect x="470" y="40" width="180" height="400" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <rect x="485" y="55" width="150" height="30" rx="6" fill="#059669"/>
  <text x="560" y="75" text-anchor="middle" class="header-title">ETAPA 3: SKILLS</text>

  <rect x="485" y="105" width="150" height="90" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="495" y="125" class="card-title" fill="#065f46">ejemplo-codigo</text>
  <text x="495" y="145" class="card-sub-green">• Código Arduino (.ino)</text>
  <text x="495" y="160" class="card-sub-green">• Mapeo de pines</text>

  <rect x="485" y="210" width="150" height="90" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="495" y="230" class="card-title" fill="#065f46">diagnostico-bug</text>
  <text x="495" y="250" class="card-sub-green">• Depuración protoboard</text>
  <text x="495" y="265" class="card-sub-green">• Leyes de Ohm</text>

  <rect x="485" y="315" width="150" height="100" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="495" y="335" class="card-title" fill="#065f46">pdf-export &amp; Quiz</text>
  <text x="495" y="355" class="card-sub-green">• Export lista BOM</text>
  <text x="495" y="370" class="card-sub-green">• Evaluaciones quiz</text>

  <path d="M 650 240 L 680 240" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STAGE 4: OUTPUT & EFFECTS -->
  <rect x="690" y="40" width="180" height="400" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="705" y="55" width="150" height="30" rx="6" fill="#047857"/>
  <text x="780" y="75" text-anchor="middle" class="header-title">ETAPA 4: RESPUESTA</text>

  <rect x="705" y="105" width="150" height="90" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="715" y="125" class="card-title" fill="#0f172a">Esquema ASCII</text>
  <text x="715" y="145" class="card-sub">• Conexiones de componentes</text>
  <text x="715" y="160" class="card-sub">• Valores de resistencias</text>

  <rect x="705" y="210" width="150" height="90" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="715" y="230" class="card-title" fill="#0f172a">Código .ino Listo</text>
  <text x="715" y="250" class="card-sub">• Explicado para 11 años</text>
  <text x="715" y="265" class="card-sub">• Setup() y Loop() claros</text>

  <rect x="705" y="315" width="150" height="100" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="715" y="335" class="card-title" fill="#0f172a">Integraciones</text>
  <text x="715" y="355" class="card-sub">• Pasa carcasa a Capa</text>
  <text x="715" y="370" class="card-sub">• Informa sensores a Master</text>
</svg>
