<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Flujo de Funcionamiento - Warden</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #0284c7;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header { text-align: center; max-width: 800px; margin-bottom: 30px; }
    .header h1 { font-size: 26px; font-weight: 700; margin: 0 0 8px 0; color: #0369a1; }
    .header p { font-size: 14px; color: var(--text-muted); margin: 0; }
    .diagram-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      max-width: 950px;
      width: 100%;
    }
    svg { width: 100%; height: auto; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Warden — Flujo de Funcionamiento en 4 Etapas</h1>
    <p>Agente Guardián Metódico del Sistema, Monitoreo y Seguridad (Cluster Infraestructura)</p>
  </div>

  <div class="diagram-container">
    <svg viewBox="0 0 900 480" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
        </marker>
      </defs>

      <!-- STAGE 1: TRIGGER -->
      <rect x="30" y="40" width="180" height="380" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="45" y="55" width="150" height="30" rx="6" fill="#0284c7"/>
      <text x="120" y="75" text-anchor="middle" font-weight="700" font-size="12" fill="#ffffff">ETAPA 1: TRIGGER</text>

      <rect x="45" y="105" width="150" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="55" y="125" font-weight="700" font-size="12" fill="#0f172a">Mención @Warden</text>
      <text x="55" y="145" font-size="11" fill="#64748b">• Reporte de estado</text>
      <text x="55" y="160" font-size="11" fill="#64748b">• Consultas de seguridad</text>

      <rect x="45" y="210" width="150" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="55" y="230" font-weight="700" font-size="12" fill="#0f172a">Cronjob / Eventos</text>
      <text x="55" y="250" font-size="11" fill="#64748b">• Monitoreo programado</text>
      <text x="55" y="265" font-size="11" fill="#64748b">• Alarmas de sobreconsumo</text>

      <rect x="45" y="315" width="150" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="55" y="335" font-weight="700" font-size="12" fill="#0f172a">Alertas de Agentes</text>
      <text x="55" y="355" font-size="11" fill="#64748b">• Errores en Capa/Elektra</text>
      <text x="55" y="370" font-size="11" fill="#64748b">• Archivos corruptos</text>

      <!-- ARROW 1 -> 2 -->
      <path d="M 210 230 L 240 230" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- STAGE 2: PROCESSING & CONTEXT -->
      <rect x="250" y="40" width="180" height="380" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
      <rect x="265" y="55" width="150" height="30" rx="6" fill="#0369a1"/>
      <text x="340" y="75" text-anchor="middle" font-weight="700" font-size="11" fill="#ffffff">ETAPA 2: CONTEXTO</text>

      <rect x="265" y="105" width="150" height="90" rx="6" fill="#ffffff" stroke="#bae6fd"/>
      <text x="275" y="125" font-weight="700" font-size="12" fill="#0369a1">Prompt System</text>
      <text x="275" y="145" font-size="11" fill="#0284c7">• Metódico & preventivo</text>
      <text x="275" y="160" font-size="11" fill="#0284c7">• Enfoque en soluciones</text>
      <text x="275" y="175" font-size="11" fill="#0284c7">• Seguridad proactiva</text>

      <rect x="265" y="210" width="150" height="90" rx="6" fill="#ffffff" stroke="#bae6fd"/>
      <text x="275" y="230" font-weight="700" font-size="12" fill="#0369a1">Auditoría de Logs</text>
      <text x="275" y="250" font-size="11" fill="#0284c7">• Revisión de excepciones</text>
      <text x="275" y="265" font-size="11" fill="#0284c7">• Inspección de red/ping</text>

      <rect x="265" y="315" width="150" height="85" rx="6" fill="#ffffff" stroke="#bae6fd"/>
      <text x="275" y="335" font-weight="700" font-size="12" fill="#0369a1">Configuración .env</text>
      <text x="275" y="355" font-size="11" fill="#0284c7">• Nemotron 120B</text>
      <text x="275" y="370" font-size="11" fill="#0284c7">• Turnos máx: 25</text>

      <!-- ARROW 2 -> 3 -->
      <path d="M 430 230 L 460 230" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- STAGE 3: SKILL EXECUTION -->
      <rect x="470" y="40" width="180" height="380" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
      <rect x="485" y="55" width="150" height="30" rx="6" fill="#0284c7"/>
      <text x="560" y="75" text-anchor="middle" font-weight="700" font-size="12" fill="#ffffff">ETAPA 3: SKILLS</text>

      <rect x="485" y="105" width="150" height="90" rx="6" fill="#ffffff" stroke="#7dd3fc"/>
      <text x="495" y="125" font-weight="700" font-size="12" fill="#0369a1">system_maintenance</text>
      <text x="495" y="145" font-size="11" fill="#0284c7">• Limpieza de archivos temp</text>
      <text x="495" y="160" font-size="11" fill="#0284c7">• Liberación de memoria</text>

      <rect x="485" y="210" width="150" height="90" rx="6" fill="#ffffff" stroke="#7dd3fc"/>
      <text x="495" y="230" font-weight="700" font-size="12" fill="#0369a1">cronjob & debugging</text>
      <text x="495" y="250" font-size="11" fill="#0284c7">• Verificaciones periódicas</text>
      <text x="495" y="265" font-size="11" fill="#0284c7">• Rastreo de fallas de red</text>

      <rect x="485" y="315" width="150" height="85" rx="6" fill="#ffffff" stroke="#7dd3fc"/>
      <text x="495" y="335" font-weight="700" font-size="12" fill="#0369a1">hermes-agent config</text>
      <text x="495" y="355" font-size="11" fill="#0284c7">• Verificación de permisos</text>
      <text x="495" y="370" font-size="11" fill="#0284c7">• Límites de sandbox</text>

      <!-- ARROW 3 -> 4 -->
      <path d="M 650 230 L 680 230" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- STAGE 4: OUTPUT & EFFECTS -->
      <rect x="690" y="40" width="180" height="380" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="705" y="55" width="150" height="30" rx="6" fill="#0369a1"/>
      <text x="780" y="75" text-anchor="middle" font-weight="700" font-size="12" fill="#ffffff">ETAPA 4: RESPUESTA</text>

      <rect x="705" y="105" width="150" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="715" y="125" font-weight="700" font-size="12" fill="#0f172a">Reporte de Salud</text>
      <text x="715" y="145" font-size="11" fill="#64748b">• Estado de CPU/RAM/Disco</text>
      <text x="715" y="160" font-size="11" fill="#64748b">• Resumen de uptime</text>

      <rect x="705" y="210" width="150" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="715" y="230" font-weight="700" font-size="12" fill="#0f172a">Tickets de Mantención</text>
      <text x="715" y="250" font-size="11" fill="#64748b">• Registro de fallas hardware</text>
      <text x="715" y="265" font-size="11" fill="#64748b">• Alertas para docentes</text>

      <rect x="705" y="315" width="150" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="715" y="335" font-weight="700" font-size="12" fill="#0f172a">Acción de Contención</text>
      <text x="715" y="355" font-size="11" fill="#64748b">• Reinicio seguro de ag.</text>
      <text x="715" y="370" font-size="11" fill="#64748b">• Purga de cola de msgs</text>
    </svg>
  </div>

</body>
</html>
