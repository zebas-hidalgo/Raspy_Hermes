<svg viewBox="0 0 900 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 12px; fill: #ffffff; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 12px; }
    .card-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
    .card-sub-purple { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #6b21a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
    </marker>
  </defs>

  <rect width="900" height="480" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- STAGE 1: TRIGGER -->
  <rect x="30" y="40" width="180" height="400" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="45" y="55" width="150" height="30" rx="6" fill="#7c3aed"/>
  <text x="120" y="75" text-anchor="middle" class="header-title">ETAPA 1: TRIGGER</text>

  <rect x="45" y="105" width="150" height="85" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="55" y="125" class="card-title" fill="#0f172a">Mención @Zaha</text>
  <text x="55" y="145" class="card-sub">• Telegram / Discord</text>
  <text x="55" y="160" class="card-sub">• Hilo de conversación</text>

  <rect x="45" y="205" width="150" height="85" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="55" y="225" class="card-title" fill="#0f172a">Slash /zaha</text>
  <text x="55" y="245" class="card-sub">• Escena 3D / WebXR</text>
  <text x="55" y="260" class="card-sub">• Shaders &amp; Three.js</text>

  <rect x="45" y="305" width="150" height="110" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="55" y="325" class="card-title" fill="#0f172a">Archivos / Inputs</text>
  <text x="55" y="345" class="card-sub">• .GLTF / .GLB / Texturas</text>
  <text x="55" y="360" class="card-sub">• Shaders GLSL (.vert/.frag)</text>
  <text x="55" y="375" class="card-sub">• Límite 10 MB</text>

  <path d="M 210 240 L 240 240" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STAGE 2: PROCESSING & CONTEXT -->
  <rect x="250" y="40" width="180" height="400" rx="10" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <rect x="265" y="55" width="150" height="30" rx="6" fill="#6b21a8"/>
  <text x="340" y="75" text-anchor="middle" class="header-title">ETAPA 2: CONTEXTO</text>

  <rect x="265" y="105" width="150" height="90" rx="6" fill="#ffffff" stroke="#e9d5ff"/>
  <text x="275" y="125" class="card-title" fill="#581c87">Prompt System</text>
  <text x="275" y="145" class="card-sub-purple">• Código creativo &amp; XR</text>
  <text x="275" y="160" class="card-sub-purple">• Three.js / WebGL</text>
  <text x="275" y="175" class="card-sub-purple">• Metodología Z.A.H.A.</text>

  <rect x="265" y="210" width="150" height="90" rx="6" fill="#ffffff" stroke="#e9d5ff"/>
  <text x="275" y="230" class="card-title" fill="#581c87">Filtro Seguridad</text>
  <text x="275" y="250" class="card-sub-purple">• Sanitización buffers 3D</text>
  <text x="275" y="265" class="card-sub-purple">• Anti-freeze WebGL loop</text>
  <text x="275" y="280" class="card-sub-purple">• Límite de turnos: 30</text>

  <rect x="265" y="315" width="150" height="100" rx="6" fill="#ffffff" stroke="#e9d5ff"/>
  <text x="275" y="335" class="card-title" fill="#581c87">Variables .env</text>
  <text x="275" y="355" class="card-sub-purple">• Nemotron 120B / Claude</text>
  <text x="275" y="370" class="card-sub-purple">• Sandbox WebXR activo</text>

  <path d="M 430 240 L 460 240" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STAGE 3: SKILL EXECUTION -->
  <rect x="470" y="40" width="180" height="400" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <rect x="485" y="55" width="150" height="30" rx="6" fill="#7c3aed"/>
  <text x="560" y="75" text-anchor="middle" class="header-title">ETAPA 3: SKILLS</text>

  <rect x="485" y="105" width="150" height="90" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="495" y="125" class="card-title" fill="#581c87">threejs_builder</text>
  <text x="495" y="145" class="card-sub-purple">• Scene, Camera, Renderer</text>
  <text x="495" y="160" class="card-sub-purple">• Geometrías algorítmicas</text>
  <text x="495" y="175" class="card-sub-purple">• Iluminación PBR</text>

  <rect x="485" y="210" width="150" height="90" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="495" y="230" class="card-title" fill="#581c87">shader_pipeline</text>
  <text x="495" y="250" class="card-sub-purple">• GLSL Vertex/Fragment</text>
  <text x="495" y="265" class="card-sub-purple">• Raymarching / SDFs</text>
  <text x="495" y="280" class="card-sub-purple">• Post-processing passes</text>

  <rect x="485" y="315" width="150" height="100" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="495" y="335" class="card-title" fill="#581c87">webxr_session</text>
  <text x="495" y="355" class="card-sub-purple">• Inmersión VR / AR</text>
  <text x="495" y="370" class="card-sub-purple">• Hand &amp; Hit-test tracking</text>

  <path d="M 650 240 L 680 240" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STAGE 4: OUTPUT & EFFECTS -->
  <rect x="690" y="40" width="180" height="400" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="705" y="55" width="150" height="30" rx="6" fill="#6b21a8"/>
  <text x="780" y="75" text-anchor="middle" class="header-title">ETAPA 4: RESPUESTA</text>

  <rect x="705" y="105" width="150" height="90" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="715" y="125" class="card-title" fill="#0f172a">Respuesta Bot</text>
  <text x="715" y="145" class="card-sub">• Bundle Three.js / HTML</text>
  <text x="715" y="160" class="card-sub">• Explicación matemática</text>
  <text x="715" y="175" class="card-sub">• Comentarios pedagógicos</text>

  <rect x="705" y="210" width="150" height="90" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="715" y="230" class="card-title" fill="#0f172a">Métricas XR</text>
  <text x="715" y="250" class="card-sub">• Presupuesto 60/90 FPS</text>
  <text x="715" y="265" class="card-sub">• Draw calls y polígonos</text>

  <rect x="705" y="315" width="150" height="100" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="715" y="335" class="card-title" fill="#0f172a">Integraciones</text>
  <text x="715" y="355" class="card-sub">• Export STL/GLTF a Capa</text>
  <text x="715" y="370" class="card-sub">• Conexión con Caraxes/Master</text>
</svg>
