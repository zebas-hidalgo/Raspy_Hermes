<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Flujo de Funcionamiento - TutorConversion</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #7c3aed;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header { text-align: center; max-width: 800px; margin-bottom: 30px; }
    .header h1 { font-size: 26px; font-weight: 700; margin: 0 0 8px 0; color: #5b21b6; }
    .header p { font-size: 14px; color: var(--text-muted); margin: 0; }
    .diagram-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      max-width: 950px;
      width: 100%;
    }
    svg { width: 100%; height: auto; }
  </style>
</head>
<body>

  <div class="header">
    <h1>TutorConversion — Flujo de Funcionamiento en 4 Etapas</h1>
    <p>Agente Conversor de Tutors Pasivos a Agentes Interactivos (Cluster Orquestación)</p>
  </div>

  <div class="diagram-container">
    <svg viewBox="0 0 900 480" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
        </marker>
      </defs>

      <!-- STAGE 1: TRIGGER -->
      <rect x="30" y="40" width="180" height="380" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="45" y="55" width="150" height="30" rx="6" fill="#7c3aed"/>
      <text x="120" y="75" text-anchor="middle" font-weight="700" font-size="12" fill="#ffffff">ETAPA 1: TRIGGER</text>

      <rect x="45" y="105" width="150" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="55" y="125" font-weight="700" font-size="12" fill="#0f172a">Mención @TutorConv.</text>
      <text x="55" y="145" font-size="11" fill="#64748b">• Conversión de guías</text>
      <text x="55" y="160" font-size="11" fill="#64748b">• Adaptación de lecciones</text>

      <rect x="45" y="210" width="150" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="55" y="230" font-weight="700" font-size="12" fill="#0f172a">Slash /tutor_conv.</text>
      <text x="55" y="250" font-size="11" fill="#64748b">• Análisis instruccional</text>
      <text x="55" y="265" font-size="11" fill="#64748b">• Extracción de Bloom</text>

      <rect x="45" y="315" width="150" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="55" y="335" font-weight="700" font-size="12" fill="#0f172a">Archivos PDF / TXT</text>
      <text x="55" y="355" font-size="11" fill="#64748b">• Guías docentes</text>
      <text x="55" y="370" font-size="11" fill="#64748b">• Manuales escolares</text>

      <!-- ARROW 1 -> 2 -->
      <path d="M 210 230 L 240 230" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- STAGE 2: PROCESSING & CONTEXT -->
      <rect x="250" y="40" width="180" height="380" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
      <rect x="265" y="55" width="150" height="30" rx="6" fill="#6d28d9"/>
      <text x="340" y="75" text-anchor="middle" font-weight="700" font-size="11" fill="#ffffff">ETAPA 2: CONTEXTO</text>

      <rect x="265" y="105" width="150" height="90" rx="6" fill="#ffffff" stroke="#ddd6fe"/>
      <text x="275" y="125" font-weight="700" font-size="12" fill="#5b21b6">Prompt System</text>
      <text x="275" y="145" font-size="11" fill="#6d28d9">• Analítico y reflexivo</text>
      <text x="275" y="160" font-size="11" fill="#6d28d9">• Transformador creativo</text>
      <text x="275" y="175" font-size="11" fill="#6d28d9">• Respetuoso del original</text>

      <rect x="265" y="210" width="150" height="90" rx="6" fill="#ffffff" stroke="#ddd6fe"/>
      <text x="275" y="230" font-weight="700" font-size="12" fill="#5b21b6">Análisis Pedagógico</text>
      <text x="275" y="250" font-size="11" fill="#6d28d9">• Objetivos de aprendizaje</text>
      <text x="275" y="265" font-size="11" fill="#6d28d9">• Hitos de evaluación</text>

      <rect x="265" y="315" width="150" height="85" rx="6" fill="#ffffff" stroke="#ddd6fe"/>
      <text x="275" y="335" font-weight="700" font-size="12" fill="#5b21b6">Configuración .env</text>
      <text x="275" y="355" font-size="11" fill="#6d28d9">• Nemotron 120B</text>
      <text x="275" y="370" font-size="11" fill="#6d28d9">• Turnos máx: 35</text>

      <!-- ARROW 2 -> 3 -->
      <path d="M 430 230 L 460 230" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- STAGE 3: SKILL EXECUTION -->
      <rect x="470" y="40" width="180" height="380" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
      <rect x="485" y="55" width="150" height="30" rx="6" fill="#7c3aed"/>
      <text x="560" y="75" text-anchor="middle" font-weight="700" font-size="12" fill="#ffffff">ETAPA 3: SKILLS</text>

      <rect x="485" y="105" width="150" height="90" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
      <text x="495" y="125" font-weight="700" font-size="12" fill="#5b21b6">tutor & quiz-interactivo</text>
      <text x="495" y="145" font-size="11" fill="#6d28d9">• Generación de preguntas</text>
      <text x="495" y="160" font-size="11" fill="#6d28d9">• Adaptación de dificultad</text>

      <rect x="485" y="210" width="150" height="90" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
      <text x="495" y="230" font-weight="700" font-size="12" fill="#5b21b6">plan & writing-plans</text>
      <text x="495" y="250" font-size="11" fill="#6d28d9">• Estructuración de skill</text>
      <text x="495" y="265" font-size="11" fill="#6d28d9">• Flujo conversacional</text>

      <rect x="485" y="315" width="150" height="85" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
      <text x="495" y="335" font-weight="700" font-size="12" fill="#5b21b6">excalidraw</text>
      <text x="495" y="355" font-size="11" fill="#6d28d9">• Ruta de aprendizaje</text>
      <text x="495" y="370" font-size="11" fill="#6d28d9">• Arbol de decisiones</text>

      <!-- ARROW 3 -> 4 -->
      <path d="M 650 230 L 680 230" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- STAGE 4: OUTPUT & EFFECTS -->
      <rect x="690" y="40" width="180" height="380" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="705" y="55" width="150" height="30" rx="6" fill="#6d28d9"/>
      <text x="780" y="75" text-anchor="middle" font-weight="700" font-size="12" fill="#ffffff">ETAPA 4: RESPUESTA</text>

      <rect x="705" y="105" width="150" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="715" y="125" font-weight="700" font-size="12" fill="#0f172a">Especificación de Agente</text>
      <text x="715" y="145" font-size="11" fill="#64748b">• Prompt adaptativo</text>
      <text x="715" y="160" font-size="11" fill="#64748b">• Banco de evaluaciones</text>

      <rect x="705" y="210" width="150" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="715" y="230" font-weight="700" font-size="12" fill="#0f172a">Hoja de Referencia</text>
      <text x="715" y="250" font-size="11" fill="#64748b">• Cheatsheet imprimible</text>
      <text x="715" y="265" font-size="11" fill="#64748b">• Resumen de conceptos</text>

      <rect x="705" y="315" width="150" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="715" y="335" font-weight="700" font-size="12" fill="#0f172a">Pase a Daemon</text>
      <text x="715" y="355" font-size="11" fill="#64748b">• Solicita empaquetado</text>
      <text x="715" y="370" font-size="11" fill="#64748b">• Publica nuevo tutor bot</text>
    </svg>
  </div>

</body>
</html>
