<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Flujo de Funcionamiento - Master</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #7c3aed;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header { text-align: center; max-width: 800px; margin-bottom: 30px; }
    .header h1 { font-size: 26px; font-weight: 700; margin: 0 0 8px 0; color: #5b21b6; }
    .header p { font-size: 14px; color: var(--text-muted); margin: 0; }
    .diagram-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      max-width: 950px;
      width: 100%;
    }
    svg { width: 100%; height: auto; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Master — Flujo de Funcionamiento en 4 Etapas</h1>
    <p>Agente Orquestador de Agentes y Flujos Multidisciplinarios (Cluster Orquestación)</p>
  </div>

  <div class="diagram-container">
    <svg viewBox="0 0 900 480" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
        </marker>
      </defs>

      <!-- STAGE 1: TRIGGER -->
      <rect x="30" y="40" width="180" height="380" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="45" y="55" width="150" height="30" rx="6" fill="#7c3aed"/>
      <text x="120" y="75" text-anchor="middle" font-weight="700" font-size="12" fill="#ffffff">ETAPA 1: TRIGGER</text>

      <rect x="45" y="105" width="150" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="55" y="125" font-weight="700" font-size="12" fill="#0f172a">Mención @Master</text>
      <text x="55" y="145" font-size="11" fill="#64748b">• Proyectos integrados</text>
      <text x="55" y="160" font-size="11" fill="#64748b">• Resolución de bloqueos</text>

      <rect x="45" y="210" width="150" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="55" y="230" font-weight="700" font-size="12" fill="#0f172a">Slash /master</text>
      <text x="55" y="250" font-size="11" fill="#64748b">• Plan de feria STEM</text>
      <text x="55" y="265" font-size="11" fill="#64748b">• Asignación de tareas</text>

      <rect x="45" y="315" width="150" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="55" y="335" font-weight="700" font-size="12" fill="#0f172a">Falla de Coordinación</text>
      <text x="55" y="355" font-size="11" fill="#64748b">• Agentes esperando entre sí</text>
      <text x="55" y="370" font-size="11" fill="#64748b">• Redirección de tareas</text>

      <!-- ARROW 1 -> 2 -->
      <path d="M 210 230 L 240 230" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- STAGE 2: PROCESSING & CONTEXT -->
      <rect x="250" y="40" width="180" height="380" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
      <rect x="265" y="55" width="150" height="30" rx="6" fill="#6d28d9"/>
      <text x="340" y="75" text-anchor="middle" font-weight="700" font-size="11" fill="#ffffff">ETAPA 2: CONTEXTO</text>

      <rect x="265" y="105" width="150" height="90" rx="6" fill="#ffffff" stroke="#ddd6fe"/>
      <text x="275" y="125" font-weight="700" font-size="12" fill="#5b21b6">Prompt System</text>
      <text x="275" y="145" font-size="11" fill="#6d28d9">• Director de Orquesta</text>
      <text x="275" y="160" font-size="11" fill="#6d28d9">• Diplomático & proactivo</text>
      <text x="275" y="175" font-size="11" fill="#6d28d9">• Enfoque en meta final</text>

      <rect x="265" y="210" width="150" height="90" rx="6" fill="#ffffff" stroke="#ddd6fe"/>
      <text x="275" y="230" font-weight="700" font-size="12" fill="#5b21b6">Grafo de Dependencias</text>
      <text x="275" y="250" font-size="11" fill="#6d28d9">• Mapeo Capa↔Elektra↔Bio</text>
      <text x="275" y="265" font-size="11" fill="#6d28d9">• Orden crítico de tareas</text>

      <rect x="265" y="315" width="150" height="85" rx="6" fill="#ffffff" stroke="#ddd6fe"/>
      <text x="275" y="335" font-weight="700" font-size="12" fill="#5b21b6">Configuración .env</text>
      <text x="275" y="355" font-size="11" fill="#6d28d9">• Nemotron 120B</text>
      <text x="275" y="370" font-size="11" fill="#6d28d9">• Turnos máx: 40 (Alto)</text>

      <!-- ARROW 2 -> 3 -->
      <path d="M 430 230 L 460 230" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- STAGE 3: SKILL EXECUTION -->
      <rect x="470" y="40" width="180" height="380" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
      <rect x="485" y="55" width="150" height="30" rx="6" fill="#7c3aed"/>
      <text x="560" y="75" text-anchor="middle" font-weight="700" font-size="12" fill="#ffffff">ETAPA 3: SKILLS</text>

      <rect x="485" y="105" width="150" height="90" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
      <text x="495" y="125" font-weight="700" font-size="12" fill="#5b21b6">delegation</text>
      <text x="495" y="145" font-size="11" fill="#6d28d9">• Despacho de sub-tareas</text>
      <text x="495" y="160" font-size="11" fill="#6d28d9">• Invocación de agentes</text>

      <rect x="485" y="210" width="150" height="90" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
      <text x="495" y="230" font-weight="700" font-size="12" fill="#5b21b6">dispatching-parallel</text>
      <text x="495" y="250" font-size="11" fill="#6d28d9">• Ejecución concurrente</text>
      <text x="495" y="265" font-size="11" fill="#6d28d9">• Sincronización de avances</text>

      <rect x="485" y="315" width="150" height="85" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
      <text x="495" y="335" font-weight="700" font-size="12" fill="#5b21b6">plan & excalidraw</text>
      <text x="495" y="355" font-size="11" fill="#6d28d9">• Plan de hito de proyecto</text>
      <text x="495" y="370" font-size="11" fill="#6d28d9">• Tablero de Gantt/Kanban</text>

      <!-- ARROW 3 -> 4 -->
      <path d="M 650 230 L 680 230" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- STAGE 4: OUTPUT & EFFECTS -->
      <rect x="690" y="40" width="180" height="380" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="705" y="55" width="150" height="30" rx="6" fill="#6d28d9"/>
      <text x="780" y="75" text-anchor="middle" font-weight="700" font-size="12" fill="#ffffff">ETAPA 4: RESPUESTA</text>

      <rect x="705" y="105" width="150" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="715" y="125" font-weight="700" font-size="12" fill="#0f172a">Plan de Proyecto</text>
      <text x="715" y="145" font-size="11" fill="#64748b">• Asignación por agente</text>
      <text x="715" y="160" font-size="11" fill="#64748b">• Cronograma y fases</text>

      <rect x="705" y="210" width="150" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="715" y="230" font-weight="700" font-size="12" fill="#0f172a">Sub-prompts @Agent</text>
      <text x="715" y="250" font-size="11" fill="#64748b">• @Capa: carcasa</text>
      <text x="715" y="265" font-size="11" fill="#64748b">• @Elektra: sensor</text>
      <text x="715" y="280" font-size="11" fill="#64748b">• @Bio: maceta eco</text>

      <rect x="705" y="315" width="150" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="715" y="335" font-weight="700" font-size="12" fill="#0f172a">Síntesis Integrada</text>
      <text x="715" y="355" font-size="11" fill="#64748b">• Consolidación final</text>
      <text x="715" y="370" font-size="11" fill="#64748b">• Reporte para docente</text>
    </svg>
  </div>

</body>
</html>
