<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ecosistema Raspy_Hermes - Kronos_School</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      
      --cluster-dominio: #059669;
      --cluster-dominio-bg: #ecfdf5;
      
      --cluster-infra: #0284c7;
      --cluster-infra-bg: #f0f9ff;
      
      --cluster-orq: #7c3aed;
      --cluster-orq-bg: #f5f3ff;
      
      --gateway-accent: #f59e0b;
      --gateway-bg: #fffbeb;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .header {
      text-align: center;
      max-width: 800px;
      margin-bottom: 30px;
    }
    
    .header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin: 0 0 10px 0;
    }
    
    .header p {
      font-size: 15px;
      color: var(--text-muted);
      margin: 0;
    }
    
    .diagram-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      max-width: 1000px;
      width: 100%;
    }
    
    svg {
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Ecosistema General de Agentes - Raspy_Hermes</h1>
    <p>Arquitectura de clusters y flujo de mensajes @Agent en el entorno educativo Kronos_School</p>
  </div>

  <div class="diagram-container">
    <svg viewBox="0 0 940 680" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
        </marker>
        <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
        </marker>
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
        </marker>
        <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
        </marker>
      </defs>

      <!-- USUARIOS & INTERFAZ -->
      <rect x="40" y="40" width="860" height="90" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5" />
      <text x="60" y="70" font-weight="700" font-size="14" fill="#b45309">Plataforma de Mensajería (Telegram / Discord Gateway)</text>
      <text x="60" y="95" font-size="13" fill="#78350f">Estudiantes y Docentes envían mensajes con sintaxis @NombreAgent o comandos slash (/capa, /elektra...)</text>
      
      <!-- FLOW ARROWS FROM GATEWAY TO CLUSTERS -->
      <path d="M 230 130 L 230 200" stroke="#059669" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-green)"/>
      <path d="M 470 130 L 470 200" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-purple)"/>
      <path d="M 710 130 L 710 200" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-blue)"/>

      <!-- CLUSTER DOMINIO -->
      <rect x="40" y="210" width="270" height="420" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
      <rect x="55" y="225" width="240" height="32" rx="6" fill="#059669"/>
      <text x="175" y="246" text-anchor="middle" font-weight="700" font-size="13" fill="#ffffff">CLUSTER DOMINIO (STEM)</text>

      <!-- Capa Card -->
      <rect x="55" y="270" width="240" height="100" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
      <text x="70" y="295" font-weight="700" font-size="14" fill="#065f46">@Capa</text>
      <text x="70" y="315" font-size="12" fill="#047857">Maestro de Impresión 3D</text>
      <text x="70" y="335" font-size="11" fill="#64748b">• Análisis STL & Slicing</text>
      <text x="70" y="350" font-size="11" fill="#64748b">• Diseño Cero Residuos</text>

      <!-- Elektra Card -->
      <rect x="55" y="385" width="240" height="100" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
      <text x="70" y="410" font-weight="700" font-size="14" fill="#065f46">@Elektra / @Chispa</text>
      <text x="70" y="430" font-size="12" fill="#047857">Experta en Electrónica</text>
      <text x="70" y="450" font-size="11" fill="#64748b">• Arduino & Microcontroladores</text>
      <text x="70" y="465" font-size="11" fill="#64748b">• Circuitos Seguros & Código</text>

      <!-- Bio Card -->
      <rect x="55" y="500" width="240" height="100" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
      <text x="70" y="525" font-weight="700" font-size="14" fill="#065f46">@Bio</text>
      <text x="70" y="545" font-size="12" fill="#047857">Mentor de Bioplásticos</text>
      <text x="70" y="565" font-size="11" fill="#64748b">• Recetas Sostenibles</text>
      <text x="70" y="580" font-size="11" fill="#64748b">• Economía Circular escolar</text>


      <!-- CLUSTER ORQUESTACIÓN -->
      <rect x="335" y="210" width="270" height="420" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
      <rect x="350" y="225" width="240" height="32" rx="6" fill="#7c3aed"/>
      <text x="470" y="246" text-anchor="middle" font-weight="700" font-size="13" fill="#ffffff">CLUSTER ORQUESTACIÓN</text>

      <!-- Master Card -->
      <rect x="350" y="270" width="240" height="150" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
      <text x="365" y="295" font-weight="700" font-size="14" fill="#5b21b6">@Master</text>
      <text x="365" y="315" font-size="12" fill="#6d28d9">Orquestador del Ecosistema</text>
      <text x="365" y="340" font-size="11" fill="#64748b">• Gestión de proyectos complejos</text>
      <text x="365" y="355" font-size="11" fill="#64748b">• Coordinación de tareas multitarea</text>
      <text x="365" y="370" font-size="11" fill="#64748b">• Resolución de dependencias</text>
      <text x="365" y="385" font-size="11" fill="#64748b">• Delegación a agentes dominio</text>

      <!-- TutorConversion Card -->
      <rect x="350" y="450" width="240" height="150" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
      <text x="365" y="475" font-weight="700" font-size="14" fill="#5b21b6">@TutorConversion</text>
      <text x="365" y="495" font-size="12" fill="#6d28d9">Conversor Pedagógico</text>
      <text x="365" y="520" font-size="11" fill="#64748b">• Análisis de guías y tutoriales</text>
      <text x="365" y="535" font-size="11" fill="#64748b">• Transformación pasivo → agente</text>
      <text x="365" y="550" font-size="11" fill="#64748b">• Extracción taxonomía Bloom</text>
      <text x="365" y="565" font-size="11" fill="#64748b">• Creación de evaluadores quiz</text>


      <!-- CLUSTER INFRAESTRUCTURA -->
      <rect x="630" y="210" width="270" height="420" rx="12" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
      <rect x="645" y="225" width="240" height="32" rx="6" fill="#0284c7"/>
      <text x="765" y="246" text-anchor="middle" font-weight="700" font-size="13" fill="#ffffff">CLUSTER INFRAESTRUCTURA</text>

      <!-- Caraxes Card -->
      <rect x="645" y="270" width="240" height="100" rx="8" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.5"/>
      <text x="660" y="295" font-weight="700" font-size="14" fill="#0369a1">@Caraxes</text>
      <text x="660" y="315" font-size="12" fill="#0284c7">Arquitecto de Skills</text>
      <text x="660" y="335" font-size="11" fill="#64748b">• Diseño de patrones de agentes</text>
      <text x="660" y="350" font-size="11" fill="#64748b">• Estructura del ecosistema</text>

      <!-- Daemon Card -->
      <rect x="645" y="385" width="240" height="100" rx="8" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.5"/>
      <text x="660" y="410" font-weight="700" font-size="14" fill="#0369a1">@Daemon</text>
      <text x="660" y="430" font-size="12" fill="#0284c7">Creador de Skills</text>
      <text x="660" y="450" font-size="11" fill="#64748b">• Desarrollo de nuevas habilidades</text>
      <text x="660" y="465" font-size="11" fill="#64748b">• Mantenimiento de repositorios</text>

      <!-- Warden Card -->
      <rect x="645" y="500" width="240" height="100" rx="8" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.5"/>
      <text x="660" y="525" font-weight="700" font-size="14" fill="#0369a1">@Warden</text>
      <text x="660" y="545" font-size="12" fill="#0284c7">Guardián del Sistema</text>
      <text x="660" y="565" font-size="11" fill="#64748b">• Monitoreo de salud y recursos</text>
      <text x="660" y="580" font-size="11" fill="#64748b">• Seguridad & Auditoría de logs</text>

      <!-- INTER-CLUSTER CONNECTIONS -->
      <path d="M 350 345 L 295 345" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-green)" stroke-dasharray="3 3"/>
      <path d="M 590 345 L 645 345" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-blue)" stroke-dasharray="3 3"/>
      <path d="M 765 500 L 765 485" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
      <path d="M 765 385 L 765 370" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
    </svg>
  </div>

</body>
</html>
