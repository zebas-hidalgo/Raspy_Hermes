<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Flujo de Funcionamiento - Bio</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #059669;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header { text-align: center; max-width: 800px; margin-bottom: 30px; }
    .header h1 { font-size: 26px; font-weight: 700; margin: 0 0 8px 0; color: #065f46; }
    .header p { font-size: 14px; color: var(--text-muted); margin: 0; }
    .diagram-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      max-width: 950px;
      width: 100%;
    }
    svg { width: 100%; height: auto; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Bio — Flujo de Funcionamiento en 4 Etapas</h1>
    <p>Agente Mentor de Bioplásticos, Química Verde y Economía Circular (Cluster Dominio)</p>
  </div>

  <div class="diagram-container">
    <svg viewBox="0 0 900 480" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
        </marker>
      </defs>

      <!-- STAGE 1: TRIGGER -->
      <rect x="30" y="40" width="180" height="380" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="45" y="55" width="150" height="30" rx="6" fill="#059669"/>
      <text x="120" y="75" text-anchor="middle" font-weight="700" font-size="12" fill="#ffffff">ETAPA 1: TRIGGER</text>

      <rect x="45" y="105" width="150" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="55" y="125" font-weight="700" font-size="12" fill="#0f172a">Mención @Bio</text>
      <text x="55" y="145" font-size="11" fill="#64748b">• Consultas de recetas</text>
      <text x="55" y="160" font-size="11" fill="#64748b">• Ingredientes caseros</text>
      <text x="55" y="175" font-size="11" fill="#64748b">• Tiempos de secado</text>

      <rect x="45" y="210" width="150" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="55" y="230" font-weight="700" font-size="12" fill="#0f172a">Slash /bio</text>
      <text x="55" y="250" font-size="11" fill="#64748b">• Tablas de biodegr.</text>
      <text x="55" y="265" font-size="11" fill="#64748b">• Proyectos compostables</text>

      <rect x="45" y="315" width="150" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="55" y="335" font-weight="700" font-size="12" fill="#0f172a">Consultas de Residuos</text>
      <text x="55" y="355" font-size="11" fill="#64748b">• Reciclaje de papel</text>
      <text x="55" y="370" font-size="11" fill="#64748b">• Almidón vs Gelatina</text>

      <!-- ARROW 1 -> 2 -->
      <path d="M 210 230 L 240 230" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- STAGE 2: PROCESSING & CONTEXT -->
      <rect x="250" y="40" width="180" height="380" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
      <rect x="265" y="55" width="150" height="30" rx="6" fill="#047857"/>
      <text x="340" y="75" text-anchor="middle" font-weight="700" font-size="11" fill="#ffffff">ETAPA 2: CONTEXTO</text>

      <rect x="265" y="105" width="150" height="90" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
      <text x="275" y="125" font-weight="700" font-size="12" fill="#065f46">Prompt System</text>
      <text x="275" y="145" font-size="11" fill="#047857">• Tono curioso & explorador</text>
      <text x="275" y="160" font-size="11" fill="#047857">• ¿Qué pasaría si...?</text>
      <text x="275" y="175" font-size="11" fill="#047857">• Foco en Química Verde</text>

      <rect x="265" y="210" width="150" height="90" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
      <text x="275" y="230" font-weight="700" font-size="12" fill="#065f46">Check de Seguridad</text>
      <text x="275" y="250" font-size="11" fill="#047857">• Uso de estufas/calor</text>
      <text x="275" y="265" font-size="11" fill="#047857">• Protección de ojos/piel</text>
      <text x="275" y="280" font-size="11" fill="#047857">• Reactivos no tóxicos</text>

      <rect x="265" y="315" width="150" height="85" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
      <text x="275" y="335" font-weight="700" font-size="12" fill="#065f46">Configuración .env</text>
      <text x="275" y="355" font-size="11" fill="#047857">• Nemotron 120B</text>
      <text x="275" y="370" font-size="11" fill="#047857">• Turnos máx: 20</text>

      <!-- ARROW 2 -> 3 -->
      <path d="M 430 230 L 460 230" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- STAGE 3: SKILL EXECUTION -->
      <rect x="470" y="40" width="180" height="380" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
      <rect x="485" y="55" width="150" height="30" rx="6" fill="#059669"/>
      <text x="560" y="75" text-anchor="middle" font-weight="700" font-size="12" fill="#ffffff">ETAPA 3: SKILLS</text>

      <rect x="485" y="105" width="150" height="90" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
      <text x="495" y="125" font-weight="700" font-size="12" fill="#065f46">Recetario Bioplásticos</text>
      <text x="495" y="145" font-size="11" fill="#047857">• Proporciones exactas (g/ml)</text>
      <text x="495" y="160" font-size="11" fill="#047857">• Almidón, glicerina, vinagre</text>
      <text x="495" y="175" font-size="11" fill="#047857">• Cargas orgánicas (madera)</text>

      <rect x="485" y="210" width="150" height="90" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
      <text x="495" y="230" font-weight="700" font-size="12" fill="#065f46">pdf-export & Fichas</text>
      <text x="495" y="250" font-size="11" fill="#047857">• Fichas de datos de material</text>
      <text x="495" y="265" font-size="11" fill="#047857">• Guías paso a paso</text>
      <text x="495" y="280" font-size="11" fill="#047857">• Procedimientos de laboratorio</text>

      <rect x="485" y="315" width="150" height="85" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
      <text x="495" y="335" font-weight="700" font-size="12" fill="#065f46">diagnostico-bug</text>
      <text x="495" y="355" font-size="11" fill="#047857">• Grietas al secar</text>
      <text x="495" y="370" font-size="11" fill="#047857">• Exceso de rigidez/flexib.</text>

      <!-- ARROW 3 -> 4 -->
      <path d="M 650 230 L 680 230" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- STAGE 4: OUTPUT & EFFECTS -->
      <rect x="690" y="40" width="180" height="380" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="705" y="55" width="150" height="30" rx="6" fill="#047857"/>
      <text x="780" y="75" text-anchor="middle" font-weight="700" font-size="12" fill="#ffffff">ETAPA 4: RESPUESTA</text>

      <rect x="705" y="105" width="150" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="715" y="125" font-weight="700" font-size="12" fill="#0f172a">Receta Paso a Paso</text>
      <text x="715" y="145" font-size="11" fill="#64748b">• Lista de ingredientes</text>
      <text x="715" y="160" font-size="11" fill="#64748b">• Instrucciones de cocción</text>
      <text x="715" y="175" font-size="11" fill="#64748b">• Tiempos de secado (24-48h)</text>

      <rect x="705" y="210" width="150" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="715" y="230" font-weight="700" font-size="12" fill="#0f172a">Análisis Ambiental</text>
      <text x="715" y="250" font-size="11" fill="#64748b">• Tiempo de biodegradación</text>
      <text x="715" y="265" font-size="11" fill="#64748b">• Impacto de huella de carbono</text>

      <rect x="705" y="315" width="150" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="715" y="335" font-weight="700" font-size="12" fill="#0f172a">Integraciones</text>
      <text x="715" y="355" font-size="11" fill="#64748b">• Filamentos bio a Capa</text>
      <text x="715" y="370" font-size="11" fill="#64748b">• Macetas bio a Master</text>
    </svg>
  </div>

</body>
</html>
