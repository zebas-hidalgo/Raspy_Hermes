<svg viewBox="0 0 940 680" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 14px; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; }
    .subdesc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
    </marker>
  </defs>

  <!-- BACKGROUND CARD -->
  <rect width="940" height="680" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- GATEWAY HEADER -->
  <rect x="40" y="40" width="860" height="90" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5" />
  <text x="60" y="70" class="title" fill="#b45309">Plataforma de Mensajería (Telegram / Discord Gateway)</text>
  <text x="60" y="95" class="desc" fill="#78350f">Estudiantes y Docentes interactúan mediante sintaxis @NombreAgent o comandos slash (/capa, /elektra, /bio...)</text>
  
  <!-- CONNECTIONS FROM GATEWAY -->
  <path d="M 230 130 L 230 200" stroke="#059669" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-green)"/>
  <path d="M 470 130 L 470 200" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-purple)"/>
  <path d="M 710 130 L 710 200" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-blue)"/>

  <!-- CLUSTER DOMINIO -->
  <rect x="40" y="210" width="270" height="430" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
  <rect x="55" y="225" width="240" height="32" rx="6" fill="#059669"/>
  <text x="175" y="246" text-anchor="middle" class="title" fill="#ffffff">CLUSTER DOMINIO (STEM)</text>

  <!-- Capa Card -->
  <rect x="55" y="270" width="240" height="105" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="70" y="295" class="title" fill="#065f46">@Capa</text>
  <text x="70" y="315" class="desc" fill="#047857">Maestro de Impresión 3D</text>
  <text x="70" y="335" class="subdesc">• Análisis STL &amp; Slicing</text>
  <text x="70" y="350" class="subdesc">• Filosofía Cero Residuos</text>

  <!-- Elektra Card -->
  <rect x="55" y="390" width="240" height="105" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="70" y="415" class="title" fill="#065f46">@Elektra / @Chispa</text>
  <text x="70" y="435" class="desc" fill="#047857">Experta en Electrónica</text>
  <text x="70" y="455" class="subdesc">• Microcontroladores &amp; Arduino</text>
  <text x="70" y="470" class="subdesc">• Circuitos Seguros &amp; Código</text>

  <!-- Bio Card -->
  <rect x="55" y="510" width="240" height="105" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="70" y="535" class="title" fill="#065f46">@Bio</text>
  <text x="70" y="555" class="desc" fill="#047857">Mentor de Bioplásticos</text>
  <text x="70" y="575" class="subdesc">• Química Verde &amp; Recetas Eco</text>
  <text x="70" y="590" class="subdesc">• Economía Circular Escolar</text>


  <!-- CLUSTER ORQUESTACIÓN -->
  <rect x="335" y="210" width="270" height="430" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <rect x="350" y="225" width="240" height="32" rx="6" fill="#7c3aed"/>
  <text x="470" y="246" text-anchor="middle" class="title" fill="#ffffff">CLUSTER ORQUESTACIÓN</text>

  <!-- Master Card -->
  <rect x="350" y="270" width="240" height="150" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="365" y="295" class="title" fill="#5b21b6">@Master</text>
  <text x="365" y="315" class="desc" fill="#6d28d9">Orquestador de Agentes</text>
  <text x="365" y="340" class="subdesc">• Proyectos multidisciplinarios</text>
  <text x="365" y="355" class="subdesc">• Ejecución multitarea paralela</text>
  <text x="365" y="370" class="subdesc">• Resolución de dependencias</text>

  <!-- TutorConversion Card -->
  <rect x="350" y="440" width="240" height="150" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="365" y="465" class="title" fill="#5b21b6">@TutorConversion</text>
  <text x="365" y="485" class="desc" fill="#6d28d9">Conversor Pedagógico</text>
  <text x="365" y="510" class="subdesc">• Análisis de guías y tutoriales</text>
  <text x="365" y="525" class="subdesc">• Transformación pasivo → bot</text>
  <text x="365" y="540" class="subdesc">• Extracción taxonomía Bloom</text>


  <!-- CLUSTER INFRAESTRUCTURA -->
  <rect x="630" y="210" width="270" height="430" rx="12" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
  <rect x="645" y="225" width="240" height="32" rx="6" fill="#0284c7"/>
  <text x="765" y="246" text-anchor="middle" class="title" fill="#ffffff">CLUSTER INFRAESTRUCTURA</text>

  <!-- Caraxes Card -->
  <rect x="645" y="270" width="240" height="105" rx="8" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="660" y="295" class="title" fill="#0369a1">@Caraxes</text>
  <text x="660" y="315" class="desc" fill="#0284c7">Arquitecto de Skills</text>
  <text x="660" y="335" class="subdesc">• Diseño de patrones de agentes</text>
  <text x="660" y="350" class="subdesc">• Modelado de ecosistemas</text>

  <!-- Daemon Card -->
  <rect x="645" y="390" width="240" height="105" rx="8" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="660" y="415" class="title" fill="#0369a1">@Daemon</text>
  <text x="660" y="435" class="desc" fill="#0284c7">Creador de Skills</text>
  <text x="660" y="455" class="subdesc">• Desarrollo de habilidades</text>
  <text x="660" y="470" class="subdesc">• Mantenimiento SKILL.md</text>

  <!-- Warden Card -->
  <rect x="645" y="510" width="240" height="105" rx="8" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="660" y="535" class="title" fill="#0369a1">@Warden</text>
  <text x="660" y="555" class="desc" fill="#0284c7">Guardián del Sistema</text>
  <text x="660" y="575" class="subdesc">• Monitoreo de salud &amp; RAM</text>
  <text x="660" y="590" class="subdesc">• Seguridad &amp; Auditoría</text>

  <!-- INTER-CLUSTER CONNECTIONS -->
  <path d="M 350 345 L 295 345" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-green)" stroke-dasharray="3 3"/>
  <path d="M 590 345 L 645 345" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-blue)" stroke-dasharray="3 3"/>
</svg>
