<svg viewBox="0 0 960 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .actor-head { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 12px; fill: #ffffff; }
    .msg-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #1e293b; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #64748b; }
    .note-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #92400e; }
  </style>
  <defs>
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>

  <!-- BACKGROUND CARD -->
  <rect width="960" height="620" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- TITLE HEADER -->
  <text x="480" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#0f172a">DIAGRAMA DE SECUENCIA UML — TRAZA DE MENSAJES Y ENRUTAMIENTO DE AGENTES</text>

  <!-- ACTORS HEADERS -->
  <!-- 1. Estudiante/Docente -->
  <rect x="50" y="60" width="140" height="40" rx="8" fill="#475569"/>
  <text x="120" y="85" text-anchor="middle" class="actor-head">Estudiante / Docente</text>
  <line x1="120" y1="100" x2="120" y2="580" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- 2. Gateway (Telegram/Discord) -->
  <rect x="230" y="60" width="140" height="40" rx="8" fill="#0284c7"/>
  <text x="300" y="85" text-anchor="middle" class="actor-head">Telegram Gateway</text>
  <line x1="300" y1="100" x2="300" y2="580" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- 3. MessageRouter & Manager -->
  <rect x="410" y="60" width="140" height="40" rx="8" fill="#7c3aed"/>
  <text x="480" y="85" text-anchor="middle" class="actor-head">Router / Manager</text>
  <line x1="480" y1="100" x2="480" y2="580" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- 4. Hermes Agent (SKILL.md) -->
  <rect x="590" y="60" width="140" height="40" rx="8" fill="#059669"/>
  <text x="660" y="85" text-anchor="middle" class="actor-head">Hermes Agent (@Bot)</text>
  <line x1="660" y1="100" x2="660" y2="580" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- 5. LLM Engine (Nemotron 120B) -->
  <rect x="770" y="60" width="140" height="40" rx="8" fill="#d97706"/>
  <text x="840" y="85" text-anchor="middle" class="actor-head">LLM (Nemotron 120B)</text>
  <line x1="840" y1="100" x2="840" y2="580" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- LIFELINE EXECUTION BOXES & STEPS -->

  <!-- Step 1: Envío de mensaje -->
  <path d="M 120 130 L 295 130" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="210" y="123" text-anchor="middle" class="msg-text">1. Envía '@Capa ¿Temperatura PLA?'</text>

  <!-- Step 2: Gateway procesa webhook -->
  <rect x="295" y="130" width="10" height="390" fill="#e0f2fe" stroke="#0284c7"/>
  <path d="M 305 160 L 475 160" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="390" y="153" text-anchor="middle" class="msg-text">2. resolve_agent(text)</text>

  <!-- Step 3: Resolution & Lookup -->
  <rect x="475" y="160" width="10" height="90" fill="#ede9fe" stroke="#7c3aed"/>
  <rect x="495" y="170" width="140" height="35" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="565" y="185" text-anchor="middle" class="note-text" font-weight="bold">Lookup Table Match</text>
  <text x="565" y="198" text-anchor="middle" class="sub-text">'@Capa' ➔ Agent ID: 'capa'</text>

  <!-- Step 4: Carga de SKILL.md -->
  <path d="M 485 220 L 655 220" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="570" y="213" text-anchor="middle" class="msg-text">3. Carga skills/capa/SKILL.md</text>

  <!-- Step 5: Carga del agente Hermes -->
  <rect x="655" y="220" width="10" height="230" fill="#d1fae5" stroke="#059669"/>
  <path d="M 665 260 L 835 260" stroke="#059669" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="750" y="253" text-anchor="middle" class="msg-text">4. Inferencia con Prompt System</text>

  <!-- Step 6: LLM Inferencia -->
  <rect x="835" y="260" width="10" height="110" fill="#fef3c7" stroke="#d97706"/>
  <rect x="740" y="280" width="90" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="785" y="298" text-anchor="middle" class="sub-text">Ejecuta stl_analyzer</text>

  <path d="M 835 340 L 665 340" stroke="#059669" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-dashed)"/>
  <text x="750" y="333" text-anchor="middle" class="msg-text">5. Retorna parámetros técnicos</text>

  <!-- Step 7: Hermes genera respuesta formateada -->
  <path d="M 655 410 L 305 410" stroke="#059669" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-dashed)"/>
  <text x="480" y="403" text-anchor="middle" class="msg-text">6. Entrega Markdown formateado</text>

  <!-- Step 8: Gateway publica en chat -->
  <path d="M 295 480 L 120 480" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-solid)"/>
  <text x="210" y="473" text-anchor="middle" class="msg-text">7. Mensaje publicado en grupo</text>

  <!-- BOTTOM FOOTER -->
  <rect x="120" y="520" width="730" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="485" y="544" text-anchor="middle" class="sub-text" font-weight="bold">Flujo completado en ~1.2 segundos • Entorno Kronos_School (Máx. 30 turnos)</text>
</svg>
