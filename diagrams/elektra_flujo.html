<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Flujo de Funcionamiento - Elektra / Chispa</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #059669;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header { text-align: center; max-width: 800px; margin-bottom: 30px; }
    .header h1 { font-size: 26px; font-weight: 700; margin: 0 0 8px 0; color: #065f46; }
    .header p { font-size: 14px; color: var(--text-muted); margin: 0; }
    .diagram-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      max-width: 950px;
      width: 100%;
    }
    svg { width: 100%; height: auto; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Elektra / Chispa — Flujo de Funcionamiento en 4 Etapas</h1>
    <p>Agente Experta en Electrónica, Microcontroladores y Circuitos Seguros (Cluster Dominio)</p>
  </div>

  <div class="diagram-container">
    <svg viewBox="0 0 900 480" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
        </marker>
      </defs>

      <!-- STAGE 1: TRIGGER -->
      <rect x="30" y="40" width="180" height="380" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="45" y="55" width="150" height="30" rx="6" fill="#059669"/>
      <text x="120" y="75" text-anchor="middle" font-weight="700" font-size="12" fill="#ffffff">ETAPA 1: TRIGGER</text>

      <rect x="45" y="105" width="150" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="55" y="125" font-weight="700" font-size="12" fill="#0f172a">Mención @Elektra</text>
      <text x="55" y="145" font-size="11" fill="#64748b">• Alias @Chispa</text>
      <text x="55" y="160" font-size="11" fill="#64748b">• Consultas de circuitos</text>
      <text x="55" y="175" font-size="11" fill="#64748b">• Ayuda en soldadura</text>

      <rect x="45" y="210" width="150" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="55" y="230" font-weight="700" font-size="12" fill="#0f172a">Slash /elektra</text>
      <text x="55" y="250" font-size="11" fill="#64748b">• Petición de esquemáticos</text>
      <text x="55" y="265" font-size="11" fill="#64748b">• Calibración de resistencias</text>

      <rect x="45" y="315" width="150" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="55" y="335" font-weight="700" font-size="12" fill="#0f172a">Esquemas & Fotos</text>
      <text x="55" y="355" font-size="11" fill="#64748b">• Imágenes de protoboards</text>
      <text x="55" y="370" font-size="11" fill="#64748b">• Código Arduino (.ino)</text>

      <!-- ARROW 1 -> 2 -->
      <path d="M 210 230 L 240 230" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- STAGE 2: PROCESSING & CONTEXT -->
      <rect x="250" y="40" width="180" height="380" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
      <rect x="265" y="55" width="150" height="30" rx="6" fill="#047857"/>
      <text x="340" y="75" text-anchor="middle" font-weight="700" font-size="11" fill="#ffffff">ETAPA 2: CONTEXTO</text>

      <rect x="265" y="105" width="150" height="90" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
      <text x="275" y="125" font-weight="700" font-size="12" fill="#065f46">Prompt System</text>
      <text x="275" y="145" font-size="11" fill="#047857">• Tono chispeante & dinámico</text>
      <text x="275" y="160" font-size="11" fill="#047857">• Metáforas de agua/voltaje</text>
      <text x="275" y="175" font-size="11" fill="#047857">• Obsesión por seguridad</text>

      <rect x="265" y="210" width="150" height="90" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
      <text x="275" y="230" font-weight="700" font-size="12" fill="#065f46">Check Seguridad</text>
      <text x="275" y="250" font-size="11" fill="#047857">• Verificación 5V/9V seguros</text>
      <text x="275" y="265" font-size="11" fill="#047857">• Alertas de polaridad</text>
      <text x="275" y="280" font-size="11" fill="#047857">• Protección de cortocircuito</text>

      <rect x="265" y="315" width="150" height="85" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
      <text x="275" y="335" font-weight="700" font-size="12" fill="#065f46">Configuración .env</text>
      <text x="275" y="355" font-size="11" fill="#047857">• Nemotron 120B</text>
      <text x="275" y="370" font-size="11" fill="#047857">• Turnos máx: 25</text>

      <!-- ARROW 2 -> 3 -->
      <path d="M 430 230 L 460 230" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- STAGE 3: SKILL EXECUTION -->
      <rect x="470" y="40" width="180" height="380" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
      <rect x="485" y="55" width="150" height="30" rx="6" fill="#059669"/>
      <text x="560" y="75" text-anchor="middle" font-weight="700" font-size="12" fill="#ffffff">ETAPA 3: SKILLS</text>

      <rect x="485" y="105" width="150" height="90" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
      <text x="495" y="125" font-weight="700" font-size="12" fill="#065f46">ejemplo-codigo</text>
      <text x="495" y="145" font-size="11" fill="#047857">• Código Arduino/ESP32</text>
      <text x="495" y="160" font-size="11" fill="#047857">• Comentarios pedagógicos</text>
      <text x="495" y="175" font-size="11" fill="#047857">• Mapeo de pines</text>

      <rect x="485" y="210" width="150" height="90" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
      <text x="495" y="230" font-weight="700" font-size="12" fill="#065f46">diagnostico-bug</text>
      <text x="495" y="250" font-size="11" fill="#047857">• Depuración de protoboard</text>
      <text x="495" y="265" font-size="11" fill="#047857">• Verificación Ohm/Leyes</text>
      <text x="495" y="280" font-size="11" fill="#047857">• Medición con multímetro</text>

      <rect x="485" y="315" width="150" height="85" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
      <text x="495" y="335" font-weight="700" font-size="12" fill="#065f46">pdf-export & quiz</text>
      <text x="495" y="355" font-size="11" fill="#047857">• Export de listas BOM</text>
      <text x="495" y="370" font-size="11" fill="#047857">• Quizzes de electrónica</text>

      <!-- ARROW 3 -> 4 -->
      <path d="M 650 230 L 680 230" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- STAGE 4: OUTPUT & EFFECTS -->
      <rect x="690" y="40" width="180" height="380" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="705" y="55" width="150" height="30" rx="6" fill="#047857"/>
      <text x="780" y="75" text-anchor="middle" font-weight="700" font-size="12" fill="#ffffff">ETAPA 4: RESPUESTA</text>

      <rect x="705" y="105" width="150" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="715" y="125" font-weight="700" font-size="12" fill="#0f172a">Diagrama ASCII / C2</text>
      <text x="715" y="145" font-size="11" fill="#64748b">• Esquemas de conexión claros</text>
      <text x="715" y="160" font-size="11" fill="#64748b">• Valores de resistencias</text>

      <rect x="705" y="210" width="150" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="715" y="230" font-weight="700" font-size="12" fill="#0f172a">Código Listo (.ino)</text>
      <text x="715" y="250" font-size="11" fill="#64748b">• Explicado para 11 años</text>
      <text x="715" y="265" font-size="11" fill="#64748b">• Setup() y Loop() claros</text>

      <rect x="705" y="315" width="150" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="715" y="335" font-weight="700" font-size="12" fill="#0f172a">Integraciones</text>
      <text x="715" y="355" font-size="11" fill="#64748b">• Coordina caja con Capa</text>
      <text x="715" y="370" font-size="11" fill="#64748b">• Alimenta sensores a Master</text>
    </svg>
  </div>

</body>
</html>
